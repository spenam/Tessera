[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-tilings"
version = "0.4.0"
description = "A lightweight parametric generator for periodic, aperiodic and k-uniform tiling art"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
tessera = "tessera.cli:main"

[tool.setuptools.packages.find]
include = ["tessera*"]
